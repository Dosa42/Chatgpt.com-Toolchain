# Generated by Rust/shared/render_workflows.py; edit task definitions and pins.
name: "Rust | build-custom"
run-name: "Rust | build-custom | ${{ inputs.request_id }}"
on:
  workflow_dispatch:
    inputs:
      request_path:
        description: "JSON request file under Rust/requests/"
        required: true
        type: string
        default: ""
      request_ref:
        description: "Commit or ref in this repository containing the request"
        required: true
        type: string
        default: "main"
      request_id:
        description: "Unique ID matching the request JSON"
        required: true
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: "rust-build-custom-${{ inputs.request_id }}-${{ github.run_id }}"
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      request_id: ${{ steps.prepare.outputs.request_id }}
      request_commit: ${{ steps.prepare.outputs.request_commit }}
    steps:
      - name: Checkout infrastructure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install orchestration Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.12"
      - name: Resolve request and target matrix
        id: prepare
        shell: bash
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
          REQUEST_REF: ${{ inputs.request_ref }}
          REQUEST_ID: ${{ inputs.request_id }}
          GH_TOKEN: ${{ github.token }}
        run: python Rust/shared/run.py prepare --task build-custom
  execute:
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout exact infrastructure commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install orchestration Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12.12"
      - name: Cache Cargo dependency downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: "rust-downloads-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}-${{ matrix.target }}-${{ needs.prepare.outputs.request_commit }}"
      - name: Execute requested task on the runner
        shell: bash
        env:
          REQUEST_PATH: ${{ inputs.request_path }}
          REQUEST_REF: ${{ needs.prepare.outputs.request_commit }}
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          BUILD_TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_TOKEN: ${{ secrets.RUST_SOURCE_TOKEN }}
        run: python Rust/tasks/build-custom/scripts/execute.py execute
      - name: Upload report and available products
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: "rust-build-custom-${{ needs.prepare.outputs.request_id }}-${{ matrix.target }}-${{ github.run_id }}-${{ github.run_attempt }}"
          path: Rust/.runs/**/report/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
